services:
  super-dj:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://superdj:superdj@postgres:5432/superdj
      STREAM_KEY_ENCRYPTION_KEY: ${STREAM_KEY_ENCRYPTION_KEY}
      UPLOADS_DIR: /data/uploads
      FIFO_DIR: /tmp
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superdj
      POSTGRES_PASSWORD: superdj
      POSTGRES_DB: superdj
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdj"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads-data:

services:
  # NOTE: as written, this compose file serves both services over plain HTTP (no TLS
  # termination anywhere). The backend's production session cookie is `Secure`, which
  # browsers silently drop over plain HTTP — a real deployment needs a TLS-terminating
  # reverse proxy in front of both `super-dj` and `frontend`. See CLAUDE.md's
  # Configuration section for details.
  super-dj:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://superdj:superdj@postgres:5432/superdj
      STREAM_KEY_ENCRYPTION_KEY: ${STREAM_KEY_ENCRYPTION_KEY}
      UPLOADS_DIR: /data/uploads
      FIFO_DIR: /tmp
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      MEDIAMTX_RTMP_URL: rtmp://mediamtx:1935
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET}
      MEDIAMTX_AUTH_PORT: "3001"
      DONATELLO_CALLBACK_KEY: ${DONATELLO_CALLBACK_KEY}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
  # SECURITY: no `ports:` entry, ever — see docker/mediamtx.yml's header and
  # test/infra/mediamtxConfig.test.ts. Reachable only as `mediamtx` on the compose network.
  # Pinned to an exact version: a moving tag could change auth or HLS behaviour under us, and this
  # one container is a shared single point of failure for every tenant's local stream.
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    environment:
      # Carries the shared secret as a path segment: MediaMTX sets no custom headers on its auth
      # POST (verified in internal/auth/manager.go), so a header-borne secret is not possible.
      MTX_AUTHHTTPADDRESS: http://super-dj:3001/internal/mediamtx-auth/${MEDIAMTX_AUTH_SECRET}
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    mem_limit: 512m
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superdj
      POSTGRES_PASSWORD: superdj
      POSTGRES_DB: superdj
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdj"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      - super-dj
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:

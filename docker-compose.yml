services:
  # NOTE: as written, this compose file serves both services over plain HTTP (no TLS
  # termination anywhere). The backend's production session cookie is `Secure`, which
  # browsers silently drop over plain HTTP — a real deployment needs a TLS-terminating
  # reverse proxy in front of both `super-dj` and `frontend`. See CLAUDE.md's
  # Configuration section for details.
  super-dj:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://superdj:superdj@postgres:5432/superdj
      STREAM_KEY_ENCRYPTION_KEY: ${STREAM_KEY_ENCRYPTION_KEY}
      UPLOADS_DIR: /data/uploads
      FIFO_DIR: /tmp
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superdj
      POSTGRES_PASSWORD: superdj
      POSTGRES_DB: superdj
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdj"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      - super-dj
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
